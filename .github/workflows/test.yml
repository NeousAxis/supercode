name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Aucune dépendance à installer : Node exécute le TypeScript directement.
      - name: tests de l'implémentation
        run: node test/run.ts

      # La suite de conformité teste le LANGAGE, pas une implémentation.
      # Elle tourne contre les deux, qui ne partagent pas une ligne de code.
      - name: conformité — implémentation Node
        run: node conformance/run.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: conformité — implémentation Python
        run: node conformance/run.mjs --cmd "python3 conformance/reference-python/super.py conform"
